# Regenerate with: dart pub global run flutter_launcher_icons
# Sources are the SVGs in assets/icon/ (C0 "Cobalt Arch"), rendered to PNG.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#2433D6"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  # Layers are drawn on the full 108dp canvas already, so no extra inset.
  adaptive_icon_foreground_inset: 0
