<div style="margin:0;padding:32px 16px;background:{{cobalt}};font-family:{{sans}};">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;margin:0 auto;border-collapse:collapse;">
    <tr>
      <td style="padding:0 4px 20px;font-family:{{syne}};font-weight:800;font-size:28px;line-height:1;letter-spacing:-1px;color:{{stone}};"><img src="https://snippetverses.app/email-logo.png" width="{{logo-width}}" height="{{logo-height}}" alt="snippet" style="display:block;border:0;outline:none;font-family:{{syne}};font-weight:800;font-size:28px;color:{{stone}};"></td>
    </tr>
    <tr>
      <td style="background:{{stone}};border-radius:24px;padding:32px 28px 30px;color:{{ink}};font-size:16px;line-height:1.6;">
        <span style="display:inline-block;padding:6px 12px;border-radius:999px;background:{{lime}};color:{{ink}};font-family:{{syne}};font-weight:700;font-size:11px;letter-spacing:2px;">{{pill}}</span>
        <h1 style="margin:18px 0 12px;font-family:{{serif}};font-weight:400;font-size:34px;line-height:1.05;color:{{ink}};">{{title}}</h1>
        {{body}}
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0 22px;">
          <tr>
            <td style="border-radius:999px;background:{{lime}};">
              <a href="%LINK%" style="display:inline-block;padding:14px 26px;border-radius:999px;font-family:{{sans}};font-weight:600;font-size:16px;color:{{ink}};text-decoration:none;">{{button}}</a>
            </td>
          </tr>
        </table>
        <p style="margin:0 0 6px;font-size:13px;color:{{ink-dim}};">Button not working? Paste this link into your browser:</p>
        <p style="margin:0;font-size:13px;word-break:break-all;"><a href="%LINK%" style="color:{{cobalt}};">%LINK%</a></p>
        <p style="margin:22px 0 0;padding-top:18px;border-top:1px solid {{rule}};font-size:14px;color:{{ink-dim}};">{{footnote}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 4px 0;font-size:13px;line-height:1.5;color:{{stone-dim}};">
        Snippet Verses · <a href="https://snippetverses.app" style="color:{{stone}};">snippetverses.app</a><br>
        Questions? <a href="mailto:support@snippetverses.app" style="color:{{stone}};">support@snippetverses.app</a>
      </td>
    </tr>
  </table>
</div>
